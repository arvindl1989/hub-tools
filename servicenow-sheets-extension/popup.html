<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Sync ServiceNow</title>
</head>
<body>
  <header>
    <h1>ServiceNow → Hub</h1>
    <p class="sub">Pulls the list view as CSV using your signed-in session and sends it to the hub.</p>
  </header>

  <button id="syncBtn" class="primary">Sync now</button>
  <p id="status" class="status"></p>

  <details id="cfg">
    <summary>Settings</summary>

    <label for="snUrl">ServiceNow list URL</label>
    <input type="text" id="snUrl" placeholder="Paste the list view URL from the address bar">
    <p class="hint">Navigate to the list you export today and copy the address bar. The classic
      <code>/now/nav/…</code> wrapper is fine — it gets unwrapped automatically.</p>

    <label for="hubUrl">Hub URL</label>
    <input type="text" id="hubUrl" placeholder="https://hub-tools-production.up.railway.app">

    <button id="saveBtn" class="secondary">Save</button>
  </details>

  <p id="last" class="last"></p>

  <script src="popup.js"></script>
</body>
</html>
